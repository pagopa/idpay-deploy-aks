microservice-chart:
  image:
    repository: ghcr.io/pagopa/idpay-ranker
    tag: snapshot-uat@sha256:b05909da0dd96ef7e8af5b122bb8d7d0e7546ca1aafe512ba115f8d697fd9986
    pullPolicy: Always

  ingress:
    host: idpay.itn.internal.uat.cstar.pagopa.it

  resources:
    requests:
      memory: "768Mi"
      cpu: "150m"
    limits:
      memory: "768Mi"
      cpu: "600m"

# Never enable autoscaling because is used for service bus queue processing
  autoscaling:
    enable: false

  envConfig:
    JAVA_TOOL_OPTIONS: >-
      -XX:InitialRAMPercentage=50.0
      -XX:MaxRAMPercentage=70.0
      -XX:+UseG1GC
      -XX:+UseContainerSupport
      -Djava.security.egd=file:/dev/./urandom
      -javaagent:/app/applicationinsights-agent.jar
      -Dapplicationinsights.configuration.file=/mnt/file-config-external/appinsights-config/applicationinsights.json
    FORCE_STOPPED: "false"
    INITIATIVE_ID: "68dd003ccce8c534d1da22bc,69e0fa95e21efa516c7b8dec,6a9921bc8b29fef67e2629f0,6a994f751e7955f5e4e7829e,6a99684c8b29fef67e262a04,6a9989d18b29fef67e262a05"

  envSecret:
    APPLICATIONINSIGHTS_CONNECTION_STRING: appinsights-instrumentation-key

  keyvault:
    name: "cstar-u-itn-idpay-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"


  # * - Queste variabili d'ambiente le troviamo su Azure DevOps all'interno della folder Library
