microservice-chart:
  image:
    repository: ghcr.io/pagopa/idpay-transactions
    tag: v1.21.0@sha256:22f0b77f6bfd36bb4834b50b1429e6fe468d4d5ff07e7aa22218eeaa62470bbb
    pullPolicy: Always

  ingress:
    host: idpay.itn.internal.cstar.pagopa.it

  resources:
    requests:
      memory: "1024Mi"
      cpu: "200m"
    limits:
      memory: "1280Mi"
      cpu: "750m"

  podDisruptionBudget:
    create: true
    maxUnavailable: 1

  deployment:
    replicas: 2 # This value must be set equal to autoscaling.minReplica

  autoscaling:
    enable: true
    minReplica: 2
    maxReplica: 5
    pollingInterval: 20 # seconds
    cooldownPeriod: 300 # seconds
    triggers:
      - type: cpu
        metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
        metadata:
          value: "60"
      - type: memory
        metricType: Utilization
        metadata:
          value: "90"

  envSecret:
    APPLICATIONINSIGHTS_CONNECTION_STRING: appinsights-instrumentation-key

  keyvault:
    name: "cstar-p-itn-idpay-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"


  # nodeSelector: {}

  # tolerations: []

  # affinity: {}

  envConfig:
    LOG_LEVEL_PAGOPA: "INFO"
    LOG_LEVEL_IDPAY: "INFO"
    JAVA_TOOL_OPTIONS: >-
      -XX:InitialRAMPercentage=40.0
      -XX:MaxRAMPercentage=85.0
      -XX:+UseG1GC
      -XX:+UseContainerSupport
      -Djava.security.egd=file:/dev/./urandom
      -javaagent:/app/applicationinsights-agent.jar
      -Dapplicationinsights.configuration.file=/mnt/file-config-external/appinsights-config/applicationinsights.json
    INVITALIA_BASE_URL: "https://prod-apim-misure.azure-api.net/pagopa/ce/v1"
    INVITALIA_TOKEN_BASE_URL: "https://login.microsoftonline.com"
    SELFCARE_INSTITUTIONS_URL: "https://api.selfcare.pagopa.it/external/v2/institutions"
