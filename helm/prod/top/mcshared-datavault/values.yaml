microservice-chart:
  image:
    repository: ghcr.io/pagopa/mcshared-datavault
    tag: 3.3.1@sha256:633590ee57fdc08e1dff2fb85af89f5f43256ebfecb9553c696d08da990081c7
    pullPolicy: Always

  ingress:
    host: idpay.itn.internal.cstar.pagopa.it

  resources:
    requests:
      memory: "288Mi"
      cpu: "100m"
    limits:
      memory: "384Mi"
      cpu: "600m"

  podDisruptionBudget:
    create: true
    maxUnavailable: 1

  deployment:
    replicas: 2 # This value must be set equal to autoscaling.minReplica

  autoscaling:
    enable: true
    minReplica: 2
    maxReplica: 7
    pollingInterval: 30 # seconds
    cooldownPeriod: 300 # seconds
    triggers:
      - type: cpu
        metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
        metadata:
          value: "60"

  envConfig:
    JAVA_TOOL_OPTIONS: >-
      -XX:-UseBASE64Intrinsics
      -XX:UseAVX=2

  envSecret:

  keyvault:
    name: "cstar-p-itn-idpay-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
