microservice-chart:

  image:
    repository: ghcr.io/pagopa/idpay-portal-welfare-backend-initiative
    tag: v1.10.0@sha256:30af919ee806e3a9ee0df05ed9a6757001716de62e343f727d3ab75fd51606d5
    pullPolicy: Always

  ingress:
    host: idpay.itn.internal.cstar.pagopa.it

  resources:
    requests:
      memory: "1Gi"
      cpu: "150m"
    limits:
      memory: "1Gi"
      cpu: "600m"

  podDisruptionBudget:
    create: true
    maxUnavailable: 1

  deployment:
    replicas: 2 # This value must be set equal to autoscaling.minReplica

  autoscaling:
    enable: true
    minReplica: 2
    maxReplica: 5
    pollingInterval: 30 # seconds
    cooldownPeriod: 300 # seconds
    triggers:
      - type: cpu
        metadata:
          type: Utilization # Allowed types are 'Utilization' or 'AverageValue'
          value: "60"
      - type: memory
        metadata:
          type: Utilization
          value: "90"

  envConfig:
    JAVA_TOOL_OPTIONS: >-
      -XX:InitialRAMPercentage=40.0
      -XX:MaxRAMPercentage=85.0
      -XX:+UseG1GC
      -XX:+UseContainerSupport
      -Djava.security.egd=file:/dev/./urandom
      -javaagent:/app/applicationinsights-agent.jar
      -Dapplicationinsights.configuration.file=/mnt/file-config-external/appinsights-config/applicationinsights.json
    INITIATIVE_LOGO_URL: "https://welfare.cstar.pagopa.it/"

  envSecret:
    APPLICATIONINSIGHTS_CONNECTION_STRING: appinsights-instrumentation-key

  keyvault:
    name: "cstar-p-itn-idpay-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"


  # nodeSelector: {}

  # tolerations: []

  # affinity: {}

  postman-test:
    run: true
    repoName: idpay-portal-welfare-backend-initiative
    dir: postman
    collectionName: "idpay-initiative-e2e.postman_collection.json"
    envVariablesFile: "idpay.postman_environment.json"
