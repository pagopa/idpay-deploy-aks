microservice-chart:
  image:
    repository: ghcr.io/pagopa/idpay-asset-register-backend
    tag: v1.6.0@sha256:787362f703fcd0a0d314b375394ef1dccb52d457f91d7d0560cb9909484a5594
    pullPolicy: Always

  ingress:
    host: idpay.itn.internal.cstar.pagopa.it

  resources:
    requests:
      memory: "832Mi"
      cpu: "100m"
    limits:
      memory: "1024Mi"
      cpu: "600m"

  podDisruptionBudget:
    create: true
    maxUnavailable: 1

  deployment:
    replicas: 2 # This value must be set equal to autoscaling.minReplica

  autoscaling:
    enable: true
    minReplica: 2
    maxReplica: 5
    pollingInterval: 30 # seconds
    cooldownPeriod: 300 # seconds
    triggers:
      - type: cpu
        metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
        metadata:
          value: "60"
      - type: memory
        metricType: Utilization
        metadata:
          value: "90"

  envConfig:
    PORTAL_RDB_URL: "https://rdb.cstar.pagopa.it/registro-dei-beni"
    JAVA_TOOL_OPTIONS: >-
      -XX:-UseBASE64Intrinsics
      -XX:UseAVX=2
      -XX:InitialRAMPercentage=40.0
      -XX:MaxRAMPercentage=85.0
      -XX:+UseG1GC
      -XX:+UseContainerSupport
      -Dio.netty.eventLoopThreads=100
      -javaagent:/app/applicationinsights-agent.jar
      -Dapplicationinsights.configuration.file=/mnt/file-config-external/appinsights-config/applicationinsights.json


  envSecret:
    APPLICATIONINSIGHTS_CONNECTION_STRING: appinsights-instrumentation-key

  keyvault:
    name: "cstar-p-itn-idpay-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
