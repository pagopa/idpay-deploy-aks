microservice-chart:
  namespace: "idpay"
  nameOverride: ""
  fullnameOverride: ""

  livenessProbe:
    create: true
    handlerType: 'exec'
    exec:
      command:
       - sh
       - -c
       - |
         log_failure() {
           message="$(date -u '+%Y-%m-%dT%H:%M:%SZ') ERROR [liveness] $*"
           printf '%s\n' "$message" >&2
           # Exec probe output is not included in container logs.
           printf '%s\n' "$message" > /proc/1/fd/1
         }

         if ! response=$(curl -fsS http://localhost:8083/connectors); then
           log_failure "Cannot retrieve connectors from Kafka Connect REST API. Probe failed; Kubernetes restarts the container after 2 consecutive failures."
           exit 1
         fi
         connectors=$(printf '%s' "$response" | grep -Eo '[^]",\[]+')
         if [ -z "$connectors" ]; then
           log_failure "No connectors returned by Kafka Connect REST API. Probe failed; Kubernetes restarts the container after 2 consecutive failures."
           exit 1
         fi

         failed=0
         for connector in $connectors; do
           if ! status=$(curl -fsS "http://localhost:8083/connectors/$connector/status"); then
             log_failure "Cannot retrieve status for connector '$connector'."
             failed=1
           elif printf '%s' "$status" | grep -q FAILED; then
             log_failure "Connector '$connector' or one of its tasks is FAILED. Status: $status"
             failed=1
           fi
         done

         if [ "$failed" -ne 0 ]; then
           log_failure "Probe failed; Kubernetes restarts the container after 2 consecutive failures (period: 30s)."
         fi
         exit "$failed"
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 2
    timeoutSeconds: 5

  readinessProbe:
    httpGet:
      path: /connectors
      port: 8083
    initialDelaySeconds: 65
    failureThreshold: 15
    periodSeconds: 30

  deployment:
    create: true
    topologySpreadConstraints:
      create: true
      useDefaultConfiguration: true

  service:
    create: true
    type: ClusterIP
    ports:
      - 8083

  ingress:
    create: true
    path: /idpaykafkaconnect/(.*)


  podAnnotations: {}

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001

  envConfig:
    APPLICATIONINSIGHTS_ROLE_NAME: "idpaykafkaconnect"
    APPLICATIONINSIGHTS_INSTRUMENTATION_LOGGING_LEVEL: "INFO"
    APPLICATIONINSIGHTS_INSTRUMENTATION_MICROMETER_ENABLED: "false"
    APPLICATIONINSIGHTS_PREVIEW_PROFILER_ENABLED: "false"
    CONNECT_PRODUCER_METADATA_MAX_AGE_MS: "180000"
    CONNECT_PRODUCER_CONNECTIONS_MAX_IDLE_MS: "180000"
    CONNECT_PRODUCER_MAX_REQUEST_SIZE: "1000000"
    CONNECT_PRODUCER_RETRIES: "3"
    CONNECT_PRODUCER_REQUEST_TIMEOUT_MS: "30000"
    CONNECT_PRODUCER_METADATA_MAX_IDLE_MS: "180000"
    CONNECT_PRODUCER_LINGER_MS: "5"
    CONNECT_PRODUCER_DELIVERY_TIMEOUT_MS: "180000"
    CONNECT_PRODUCER_COMPRESSION_TYPE: "none"
    CONNECT_METADATA_MAX_AGE_MS: "180000"
    CONNECT_CONNECTIONS_MAX_IDLE_MS: "180000"
    CONNECT_HEARTBEAT_INTERVAL_MS: "3000"
    CONNECT_SESSION_TIMEOUT_MS: "30000"
    CONNECT_MAX_POLL_INTERVAL_MS: "300000"
    GROUP_ID: kafka-connect-consumer-group
    CONFIG_STORAGE_TOPIC: idpay-cdc-configs
    OFFSET_STORAGE_TOPIC: idpay-cdc-offsets
    STATUS_STORAGE_TOPIC: idpay-cdc-status
    CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
    CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"

    # allows to get secrets from environment variables
    CONNECT_CONFIG_PROVIDERS: "env"
    CONNECT_CONFIG_PROVIDERS_ENV_CLASS: "org.apache.kafka.common.config.provider.EnvVarConfigProvider"

  externalConfigMapValues:
    idpay-common:
      TZ: TZ


    idpay-eventhub-00:
      BOOTSTRAP_SERVERS: kafka_broker
      CONNECT_SECURITY_PROTOCOL: kafka_security_protocol
      CONNECT_SASL_MECHANISM: kafka_sasl_mechanism
      CONNECT_PRODUCER_SECURITY_PROTOCOL: kafka_security_protocol
      CONNECT_PRODUCER_SASL_MECHANISM: kafka_sasl_mechanism


  envSecret:
    COSMOS_CONNECTION_STRING: mongodb-primary-connection-string
    CONNECT_SASL_JAAS_CONFIG: evh-root-sasl-jaas-config-idpay-00
    CONNECT_PRODUCER_SASL_JAAS_CONFIG: evh-root-sasl-jaas-config-idpay-00
    POSTGRES_HOST: idpay-postgres-host
    POSTGRES_USERNAME: idpay-postgres-kafka-connect-user
    POSTGRES_PASSWORD: idpay-postgres-kafka-connect-password

  # nodeSelector: {}

  tolerations:
    - key: "idpayOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: domain
            operator: In
            values:
            - idpay

  externalConfigMapFiles:
    create: true
    configMaps:
      - name: appinsights-config
        key: applicationinsights.json

  tmpVolumeMount:
    create: true
    mounts:
      - name: tmp
        mountPath: /tmp

# How to deploy Canary(?)
# To deploy a canary version:
# 1. Uncomment and set nameOverride: "canary"
# 2. Set canaryDelivery.create: true
# 3. Configure the hotfix image tag in canaryDelivery.image.tag
# 4. Revert for remove canary deployment
#  nameOverride: "canary"
  canaryDelivery:
    create: false
    ingress:
      header: true
      headerName: X-Canary
      headerValue: canary
      weightPercent: 10
    image:
      repository: ghcr.io/pagopa/idpay-kafka-connect
      tag: <HOT_FIX_IMAGE_HERE>
    envSecret: {}
    envConfig: {}
