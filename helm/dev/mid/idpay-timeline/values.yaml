microservice-chart:
  image:
    repository: ghcr.io/pagopa/idpay-timeline
    tag: snapshot-develop@sha256:e0800a71dffa631e133bb932493c8624a3850be509ec360f276314db01deaef6
    pullPolicy: Always

  ingress:
    host: idpay.itn.internal.dev.cstar.pagopa.it

  resources:
    requests:
      memory: "64Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "200m"

  autoscaling:
    enable: true
    minReplica: 1
    maxReplica: 2
    pollingInterval: 30 # seconds
    cooldownPeriod: 300 # seconds
    triggers:
      - type: cpu
        metricType: Utilization # Allowed types are 'Utilization' or 'AverageValue'
        metadata:
          value: "70"
      - type: memory
        metricType: Utilization
        metadata:
          value: "90"

  envSecret:
    aks-api-url: cstar-d-itn-dev-aks-apiserver-url

  keyvault:
    name: "cstar-d-itn-idpay-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"

